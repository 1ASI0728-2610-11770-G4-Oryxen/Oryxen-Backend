name: Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'Oryxen.API.slnx'
  API_PROJECT: 'src/Oryxen.API/Oryxen.API.csproj'
  IMAGE_NAME: 'oryxen-backend'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: oryxen_user
          POSTGRES_PASSWORD: oryxen_password
          POSTGRES_DB: oryxen_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ${{ env.PROJECT_PATH }} --configuration Release --no-build --verbosity normal

  docker-build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        run: |
          echo "tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile \
            -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.branch }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          docker tag ${{ env.IMAGE_NAME }}:latest ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}:latest
          docker push ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          docker push ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}:latest
